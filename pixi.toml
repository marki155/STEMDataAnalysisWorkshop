[workspace]
name = "stem-data-analysis-workshop"
description = "EELS and EDX analysis with HyperSpy - workshop environment"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
hyperspy = ">=2.2"
exspy = ">=0.3"
hyperspy-gui-ipywidgets = ">=2.0"
numpy = ">=1.26"
scipy = ">=1.11"
# <3.11: HyperSpy 2.4.0 passes marker colours in a form that matplotlib 3.11
# takes apart element by element -> "Invalid RGBA argument".
# Affects plot(background_windows=...) in notebook 02, among others.
matplotlib-base = ">=3.8,<3.11"
ipympl = ">=0.9"
jupyterlab = ">=4.2"
ipykernel = "*"
pooch = "*"

[tasks]
# JUPYTER_PREFER_ENV_PATH=1 makes JupyterLab load the extensions from THIS
# environment before any the user already has installed elsewhere (on Windows
# that is %APPDATA%\jupyter\labextensions). Without it, an older
# jupyter-matplotlib or widget manager sitting in the user directory can shadow
# the one pinned here, and interactive plots then silently fail to render while
# everything else keeps working.
lab = { cmd = "jupyter lab", description = "Start JupyterLab", env = { JUPYTER_PREFER_ENV_PATH = "1" } }
check = { cmd = "python check_setup.py", description = "Check the installation" }
extensions = { cmd = "jupyter labextension list", description = "Show which JupyterLab extensions are active", env = { JUPYTER_PREFER_ENV_PATH = "1" } }
